
x-minio-common: &minio-common
  image: pgsty/silo:latest
  command: server --console-address ":9001" http://minio{1...4}/data{1...2}
  env_file:
    - .env
  expose:
    - "9000"
    - "9001"
  cpus: "1.0"
  mem_limit: 1280m
  healthcheck:
    test: ["CMD", "mc", "ready", "local"]
    interval: 5s
    timeout: 5s
    retries: 5
  restart: unless-stopped

services:

  # =====================================
  # MINIO CLUSTER - NODE 1
  # =====================================
  minio1:
    <<: *minio-common
    hostname: minio1
    volumes:
      - ./cluster-data/node1/data1:/data1
      - ./cluster-data/node1/data2:/data2

  # =====================================
  # MINIO CLUSTER - NODE 2
  # =====================================
  minio2:
    <<: *minio-common
    hostname: minio2
    volumes:
      - ./cluster-data/node2/data1:/data1
      - ./cluster-data/node2/data2:/data2

  # =====================================
  # MINIO CLUSTER - NODE 3
  # =====================================
  minio3:
    <<: *minio-common
    hostname: minio3
    volumes:
      - ./cluster-data/node3/data1:/data1
      - ./cluster-data/node3/data2:/data2

  # =====================================
  # MINIO CLUSTER - NODE 4
  # =====================================
  minio4:
    <<: *minio-common
    hostname: minio4
    volumes:
      - ./cluster-data/node4/data1:/data1
      - ./cluster-data/node4/data2:/data2

  # =====================================
  # MINIO USER INITIALIZATION
  # =====================================
  minio-init:
    image: pgsty/silo:latest
    depends_on:
      minio1:
        condition: service_healthy
      minio2:
        condition: service_healthy
      minio3:
        condition: service_healthy
      minio4:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./radiolog-policy.json:/policies/radiolog-policy.json:ro
      - ./dokter-policy.json:/policies/dokter-policy.json:ro
      - ./k6-policy.json:/policies/k6-policy.json:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e

        echo "Menghubungkan ke MinIO Cluster..."

        until mc alias set local http://minio1:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
          echo "Menunggu MinIO..."
          sleep 5
        done

        until mc ready local; do
          echo "Menunggu cluster siap..."
          sleep 5
        done

        echo "Membuat bucket pacs-medical..."
        mc mb --ignore-existing local/pacs-medical

        create_user() {
          USERNAME="$$1"
          PASSWORD="$$2"
          POLICY="$$3"

          echo "Memproses akun: $$USERNAME"

          if ! mc admin user info local "$$USERNAME" >/dev/null 2>&1; then
            mc admin user add local "$$USERNAME" "$$PASSWORD"
          else
            echo "Akun $$USERNAME sudah tersedia."
          fi

          if ! mc admin policy info local "$$POLICY" >/dev/null 2>&1; then
            mc admin policy create local "$$POLICY" "/policies/$$POLICY.json"
          fi

          mc admin policy attach local "$$POLICY" --user "$$USERNAME"
        }

        create_user radiolog "$$RADIOLOG_PASSWORD" radiolog-policy
        create_user dokter "$$DOKTER_PASSWORD" dokter-policy
        create_user k6tester "$$K6TESTER_PASSWORD" k6-policy

        echo "Memproses akun admin..."

        if ! mc admin user info local admin >/dev/null 2>&1; then
          mc admin user add local admin "$$ADMIN_PASSWORD"
        else
          echo "Akun admin sudah tersedia."
        fi

        mc admin policy attach local consoleAdmin --user admin

        echo "=================================="
        echo "INISIALISASI SELESAI"
        echo "Semua akun dan policy telah diproses."
        echo "=================================="
    restart: "no"

  # =====================================
  # NGINX LOAD BALANCER 1
  # =====================================
  nginx1:
    image: nginx:1.27-alpine
    hostname: nginx1
    cpus: "0.5"
    mem_limit: 256m
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "9000:9000"
      - "9001:9001"
    depends_on:
      - minio1
      - minio2
      - minio3
      - minio4
    restart: unless-stopped

  # =====================================
  # NGINX LOAD BALANCER 2
  # =====================================
  nginx2:
    image: nginx:1.27-alpine
    hostname: nginx2
    cpus: "0.5"
    mem_limit: 256m
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "9100:9000"
      - "9101:9001"
    depends_on:
      - minio1
      - minio2
      - minio3
      - minio4
    restart: unless-stopped

  # =====================================
  # MONITORING - PROMETHEUS
  # =====================================
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--web.enable-remote-write-receiver'
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped

  # =====================================
  # MONITORING - GRAFANA
  # =====================================
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

# =====================================
# DOCKER VOLUMES
# =====================================
volumes:
  grafana-data:
